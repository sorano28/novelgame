<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>滅びのはてで、きみを思い出す</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/ui.css" />
  </head>
  <body>
    <div id="app" class="app">
      <div id="background-layer" class="background-layer"></div>
      <div id="fade-layer" class="fade-layer"></div>

      <section id="title-screen" class="screen title-screen active">
        <h1 class="game-title">滅びのはてで、きみを思い出す</h1>
        <p id="title-endings" class="title-subtitle">到達エンド: 0 / 5</p>
        <div class="menu-column">
          <button data-action="new-game" class="menu-btn">はじめから</button>
          <button data-action="open-load" class="menu-btn">つづきから</button>
          <button data-action="open-settings" class="menu-btn">設定</button>
        </div>
      </section>

      <section id="game-screen" class="screen game-screen" aria-live="polite">
        <button id="menu-toggle" class="icon-btn" title="メニュー">≡</button>

        <div id="choice-container" class="choice-container hidden"></div>

        <div id="next-indicator" class="next-indicator">▶</div>

        <div id="text-box" class="text-box">
          <div id="speaker" class="speaker"></div>
          <p id="text" class="text"></p>
          <div class="text-controls">
            <button data-action="toggle-skip" class="text-btn">スキップ:OFF</button>
            <button data-action="open-backlog" class="text-btn">バックログ</button>
            <button data-action="open-save" class="text-btn">セーブ</button>
            <button data-action="open-load" class="text-btn">ロード</button>
          </div>
        </div>
      </section>

      <section id="name-modal" class="modal hidden">
        <div class="modal-card">
          <h2>名前入力</h2>
          <input id="name-input" type="text" maxlength="12" placeholder="主人公の名前" />
          <button data-action="confirm-name" class="menu-btn">決定</button>
        </div>
      </section>

      <section id="gender-modal" class="modal hidden">
        <div class="modal-card">
          <h2>性別選択</h2>
          <div class="menu-column">
            <button data-gender="female" class="menu-btn gender-btn">女性</button>
            <button data-gender="male" class="menu-btn gender-btn">男性</button>
            <button data-gender="other" class="menu-btn gender-btn">その他</button>
          </div>
        </div>
      </section>

      <section id="menu-overlay" class="modal hidden">
        <div class="modal-card">
          <h2>メニュー</h2>
          <div class="menu-column">
            <button data-action="open-save" class="menu-btn">セーブ</button>
            <button data-action="open-load" class="menu-btn">ロード</button>
            <button data-action="open-settings" class="menu-btn">設定</button>
            <button data-action="open-backlog" class="menu-btn">バックログ</button>
            <button data-action="return-title" class="menu-btn warn">タイトルへ戻る</button>
            <button data-action="close-modal" class="menu-btn">閉じる</button>
          </div>
        </div>
      </section>

      <section id="save-modal" class="modal hidden">
        <div class="modal-card wide">
          <h2>セーブ</h2>
          <div id="save-slots" class="slots"></div>
          <button data-action="close-modal" class="menu-btn">閉じる</button>
        </div>
      </section>

      <section id="load-modal" class="modal hidden">
        <div class="modal-card wide">
          <h2>ロード</h2>
          <div id="load-slots" class="slots"></div>
          <button data-action="close-modal" class="menu-btn">閉じる</button>
        </div>
      </section>

      <section id="settings-modal" class="modal hidden">
        <div class="modal-card">
          <h2>設定</h2>
          <label class="slider-label">効果音音量: <span id="volume-value">80</span></label>
          <input id="volume-slider" type="range" min="0" max="100" step="1" />
          <button data-action="close-modal" class="menu-btn">閉じる</button>
        </div>
      </section>

      <section id="backlog-modal" class="modal hidden">
        <div class="modal-card wide">
          <h2>バックログ</h2>
          <div id="backlog-list" class="backlog-list"></div>
          <button data-action="close-modal" class="menu-btn">閉じる</button>
        </div>
      </section>

      <section id="ending-screen" class="screen ending-screen">
        <h2 id="ending-title"></h2>
        <p id="ending-text"></p>
        <button data-action="return-title" class="menu-btn">タイトルへ戻る</button>
      </section>

      <div id="toast" class="toast hidden"></div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
